status:
  scope: >-
    The twenty principal declarations have the precise ranges recorded in
    docs/THEOREMS.md and release-targets.json. Rectangular statements impose
    only nonnegativity and total mass one; Dittert uses total mass n.
    Endpoint families include transpose and all statements give sharp
    inequality and iff uniform equality. K=1 is separated from the general
    uniqueness claim. The deliberate Challenge statement placeholders are
    excluded from proof counts. Solution does not import Challenge.
    No full arbitrary-rectangle P2 or unrestricted new Dittert priority
    claim is made.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

automation:
  methods:
    - method: "agent"
      models: ["OpenAI Codex (GPT-6)"]
      framework: "Codex with parallel mathematical and Lean agents"
      tool_setup: >-
        Agents developed substantial mathematics, Lean proofs and exact
        finite certificates under JD Jones's direction. Lean 4.33.0 and
        Mathlib are pinned. Ordinary kernel proofs check finite identities,
        positive-semidefinite certificates and complete dispatch coverage.
        No native-evaluation trust extension or custom proof axiom is used.
      prompting_notes: >-
        JD selected the problem, requested a separate substantive proof
        repository, and required exact scope, independently replayable
        evidence, attribution, and verification before public release.
  spend_usd: "not tracked"
  notes: "See DISCLOSURE.md; detailed prompt and monetary accounting was not retained."

fidelity:
  divergences: >-
    The square proof is an alternative spectral and stationary-cut argument.
    The rectangular proof uses actual collision laws, matrix averaging,
    retained kernels, finite certificates and permanent boundary bounds.
    Algebraic identities retain signed inputs where proved, but their
    probabilistic conclusions require nonnegative matrices. Original-row
    and deleted-row avoidance probabilities remain distinct. All-integer
    ranges and exact closed thresholds replace no theorem by a finite sample.

review:
  status: "self-assessed"
  notes: >-
    AI agents developed and independently cross-reviewed the proof chains.
    No independent human expert refereeing or source-author endorsement is
    claimed. docs/VERIFICATION.md and exact-commit receipts distinguish
    source checks, Lean kernel compilation, Comparator and NanoDa replay,
    independent CI and manual registry intake. Mechanical acceptance alone
    establishes neither novelty nor mathematical significance.

