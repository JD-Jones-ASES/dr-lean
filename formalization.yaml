version: "v0.4"

project:
  name: "dr-lean: Dittert and rectangular semimatching inequalities"
  description: >-
    A Lean 4 alternative proof of the square Dittert inequality in every
    positive dimension, and sharp rectangular semimatching inequalities.
    Rectangular results include every admissible rectangle at K=2 and K=3,
    every four-row rectangle at K=4, the 5-by-5 and 20-by-20 K=4 cases,
    all-order large-board thresholds, the stated endpoint strips, and
    their small-side corollaries, and K=n-1 on every square of order n>=21.
    The probability event is distinct rows
    or distinct columns in independent draws with replacement. Every
    theorem includes nonnegative boundary matrices and unique equality
    at the uniform matrix. Full arbitrary-rectangle Rybin P2 remains open.
  authors: ["JD Jones"]
  responsible_maintainers: ["JD Jones"]
  license: "MIT"

classification:
  arxiv: ["math.CO"]
  msc2020: ["05A20", "15A15"]

